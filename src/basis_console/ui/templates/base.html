<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BASIS Console{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">BASIS Console</div>
    <nav class="nav">
      {% for label, path in nav %}
        <a href="{{ path }}" class="{{ 'active' if active == path else '' }}">{{ label }}</a>
      {% endfor %}
    </nav>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>basis-console &middot; v0.1.0 (release candidate) &middot; gateway-first operational interface</span>
    <span>Does not evaluate authorization &middot; does not authenticate users</span>
  </footer>
</body>
</html>
